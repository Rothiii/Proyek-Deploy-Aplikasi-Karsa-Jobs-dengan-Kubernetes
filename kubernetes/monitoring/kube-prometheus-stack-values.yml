# Values override untuk Helm chart prometheus-community/kube-prometheus-stack.
# Chart ini sudah menyediakan Prometheus, Alertmanager, Grafana, dan exporter
# (node-exporter, kube-state-metrics) sekaligus, jadi tidak perlu tulis manifest
# StatefulSet/Deployment Prometheus & Grafana dari nol.

grafana:
  enabled: true  # Aktifkan Grafana bawaan chart

  adminUser: admin  # Username login Grafana
  adminPassword: supersecretgrafana  # Password login Grafana (ganti sesuai kebutuhan, idealnya lewat Secret)

  service:
    type: NodePort  # Supaya Grafana bisa diakses dari luar cluster lewat Node IP
    nodePort: 30030  # Custom NodePort untuk akses Grafana

  # Dashboard bawaan untuk memantau cluster & workload Karsa Jobs
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      kubernetes-cluster-monitoring:
        gnetId: 315  # ID dashboard "Kubernetes cluster monitoring (via Prometheus)" dari grafana.com/dashboards
        revision: 3
        datasource: Prometheus

prometheus:
  service:
    type: NodePort  # Supaya Prometheus UI bisa diakses dari luar cluster lewat Node IP
    nodePort: 30090  # Custom NodePort untuk akses Prometheus

  prometheusSpec:
    retention: 3d  # Batasi retensi data Prometheus supaya hemat storage di lokal (minikube)
    resources:
      requests:
        cpu: 200m
        memory: 512Mi

alertmanager:
  enabled: false  # Nonaktifkan Alertmanager, tidak dibutuhkan untuk kebutuhan submission ini
